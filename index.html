<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Yan ♡</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: #0c0b0e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Tahoma, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }

    .scene {
      position: relative;
      width: min(100vw, 150vh);
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: #141316;
      box-shadow: 0 0 90px rgba(0, 0, 0, 0.85);
      user-select: none;
    }

    .scene img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      pointer-events: none;
    }

    .yan-touch {
      position: absolute;
      left: 37%;
      top: 11%;
      width: 26%;
      height: 42%;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 45% 45% 35% 35%;
      z-index: 10;
    }

    .blush {
      position: absolute;
      top: 30.5%;
      width: 5.4%;
      height: 3.6%;
      background: radial-gradient(circle, #ff8eab 0%, #ff6b8a 55%, transparent 100%);
      border-radius: 50%;
      filter: blur(8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
      z-index: 5;
    }

    .blush.left  { left: 43.2%; }
    .blush.right { left: 51.8%; }

    .scene.petting .blush {
      opacity: 0.88;
    }

    .heart {
      position: absolute;
      color: #ffb7c9;
      font-size: clamp(16px, 2.8vw, 34px);
      pointer-events: none;
      animation: floatHeart 1.6s ease-out forwards;
      z-index: 20;
      text-shadow: 0 0 10px rgba(255, 140, 170, 0.55);
    }

    @keyframes floatHeart {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0.35) rotate(-12deg);
      }
      18% { opacity: 1; }
      100% {
        opacity: 0;
        transform: translateY(-110px) scale(1.4) rotate(14deg);
      }
    }

    .kiss {
      position: absolute;
      left: 55%;
      top: 17%;
      color: #ff9eb5;
      font-size: clamp(24px, 3.6vw, 38px);
      pointer-events: none;
      animation: kissFly 1.75s
