<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yan ♡</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #171519;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Georgia, serif;
  overflow: hidden;
}

.scene {
  position: relative;
  width: min(100vw, 150vh);
  aspect-ratio: 1664 / 1024;
  overflow: hidden;
  background: #242127;
  box-shadow: 0 0 70px #000;
}

.scene img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

/* Clickable Yan area */
.yan-touch {
  position: absolute;
  left: 39%;
  top: 14%;
  width: 23%;
  height: 31%;
  border: 0;
  background: transparent;
  cursor: pointer;
  border-radius: 45%;
  -webkit-tap-highlight-color: transparent;
}

/* Blush */
.blush {
  position: absolute;
  top: 32%;
  width: 5%;
  height: 3%;
  background: #ed8297;
  border-radius: 50%;
  filter: blur(8px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s;
}

.blush.left {
  left: 44%;
}

.blush.right {
  left: 52%;
}

.scene.petting .blush {
  opacity: .75;
}

/* Blink effect */
.blink {
  position: absolute;
  top: 27.8%;
  width: 3.1%;
  height: 0;
  background: #b98779;
  border-radius: 50%;
  opacity: 0;
  pointer-events: none;
}

.blink.left {
  left: 46%;
}

.blink.right {
  left: 51%;
}

.scene.blinking .blink {
  height: 1.3%;
  opacity: .9;
  transition: height .08s;
}

/* Hearts */
.heart {
  position: absolute;
  color: #f5c2d9;
  font-size: clamp(18px, 3vw, 35px);
  pointer-events: none;
  animation: floatHeart 1.5s ease-out forwards;
  z-index: 5;
}

@keyframes floatHeart {
  0% {
    opacity: 0;
    transform: translateY(0) scale(.5);
  }
  20% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    transform: translateY(-90px) scale(1.3);
  }
}

/* Kiss */
.kiss {
  position: absolute;
  left: 55%;
  top: 20%;
  color: #f5c2d9;
  font-size: 30px;
  animation: kissFly 1.6s ease-out forwards;
  pointer-events: none;
}

@keyframes kissFly {
  0% {
    opacity: 0;
    transform: scale(.5);
  }
  30% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    transform: translate(55px,-65px) scale(1.4);
  }
}

/* Message */
.message {
  position: absolute;
  left: 50%;
  top: 48%;
  transform: translateX(-50%);
  color: #f3d7e5;
  font-size: clamp(12px, 2vw, 20px);
  opacity: 0;
  white-space: nowrap;
  pointer-events: none;
  text-shadow: 0 2px 10px #000;
  transition: opacity .3s;
}

.scene.petting .message {
  opacity: 1;
}

/* Small instruction */
.hint {
  position: absolute;
  bottom: 2%;
  left: 50%;
  transform: translateX(-50%);
  color: #e5d4df;
  font-size: clamp(10px, 1.3vw, 15px);
  text-align: center;
  white-space: nowrap;
  text-shadow: 0 2px 8px #000;
  pointer-events: none;
}

@media (max-width: 600px) {
  .scene {
    width: 100vw;
    height: 100vh;
    aspect-ratio: auto;
  }

  .scene img {
    object-fit: cover;
    object-position: center;
  }

  .yan-touch {
    left: 36%;
    top: 18%;
    width: 29%;
    height: 29%;
  }

  .blush.left { left: 42%; }
  .blush.right { left: 53%; }

  .blink.left { left: 45%; }
  .blink.right { left: 52%; }
}
</style>
</head>

<body>

<div class="scene" id="scene">

  <img src="room.png" alt="Yan in her cozy modern room">

  <button class="yan-touch"
    id="yanTouch"
    aria-label="Pet Yan">
  </button>

  <div class="blush left"></div>
  <div class="blush right"></div>

  <div class="blink left"></div>
  <div class="blink right"></div>

  <div class="message" id="message">
    hehe... ♡
  </div>

  <div class="hint">
    ♡ Tap Yan's head to give her some love ♡
  </div>

</div>

<script>
const scene = document.getElementById("scene");
const button = document.getElementById("yanTouch");
const message = document.getElementById("message");

let audioContext;

function playCuteSound() {
  try {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return;

    if (!audioContext) {
      audioContext = new Audio();
    }

    if (audioContext.state === "suspended") {
      audioContext.resume();
    }

    const oscillator = audioContext.createOscillator();
    const volume = audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(
      850, audioContext.currentTime
    );

    oscillator.frequency.exponentialRampToValueAtTime(
      1200, audioContext.currentTime + .12
    );

    volume.gain.setValueAtTime(
      .001, audioContext.currentTime
    );

    volume.gain.linearRampToValueAtTime(
      .13, audioContext.currentTime + .03
    );

    volume.gain.exponentialRampToValueAtTime(
      .001, audioContext.currentTime + .25
    );

    oscillator.connect(volume);
    volume.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + .26);

  } catch (error) {
    console.log("Audio unavailable");
  }
}

function makeHeart(x, y) {
  const heart = document.createElement("div");

  heart.className = "heart";
  heart.textContent = ["♡", "♥", "✧"][Math.floor(Math.random() * 3)];

  heart.style.left = x + "%";
  heart.style.top = y + "%";

  scene.appendChild(heart);

  setTimeout(() => heart.remove(), 1600);
}

button.addEventListener("click", () => {
  scene.classList.add("petting");

  message.textContent = [
    "hehe... ♡",
    "that feels nice!",
    "you're sweet ♡",
    "again? ♡"
  ][Math.floor(Math.random() * 4)];

  playCuteSound();

  makeHeart(
    42 + Math.random() * 16,
    23 + Math.random() * 10
  );

  setTimeout(() => {
    scene.classList.remove("petting");
  }, 1300);
});

// Natural blinking effect
function blink() {
  scene.classList.add("blinking");

  setTimeout(() => {
    scene.classList.remove("blinking");
  }, 140);
}

function scheduleBlink() {
  const delay = 2500 + Math.random() * 3500;

  setTimeout(() => {
    blink();
    scheduleBlink();
  }, delay);
}

scheduleBlink();

// Occasional floating hearts
function littleHeart() {
  makeHeart(
    39 + Math.random() * 23,
    17 + Math.random() * 18
  );
}

setInterval(littleHeart, 14000);

// Occasional kiss
function sendKiss() {
  const kiss = document.createElement("div");

  kiss.className = "kiss";
  kiss.textContent = "♡";

  scene.appendChild(kiss);

  setTimeout(() => kiss.remove(), 1700);
}

setInterval(sendKiss, 18000);

</script>

</body>
</html>
