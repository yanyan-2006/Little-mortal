<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Yan ♡</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: #0c0b0e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Tahoma, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }

    .scene {
      position: relative;
      width: min(100vw, 150vh);
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: #141316;
      box-shadow: 0 0 90px rgba(0, 0, 0, 0.85);
      user-select: none;
    }

    .scene img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      pointer-events: none;
    }

    /* Touch area */
    .yan-touch {
      position: absolute;
      left: 37%;
      top: 11%;
      width: 26%;
      height: 42%;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 45% 45% 35% 35%;
      z-index: 10;
    }

    /* Blush - به داخل‌تر اومده */
    .blush {
      position: absolute;
      top: 31.8%;
      width: 4.8%;
      height: 3.1%;
      background: radial-gradient(circle, #ff8eab 0%, #ff6b8a 55%, transparent 100%);
      border-radius: 50%;
      filter: blur(7px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
      z-index: 5;
    }

    .blush.left  { left: 44.3%; }
    .blush.right { left: 50.7%; }

    .scene.petting .blush {
      opacity: 0.88;
    }

    /* Hearts */
    .heart {
      position: absolute;
      color: #ffb7c9;
      font-size: clamp(16px, 2.8vw, 34px);
      pointer-events: none;
      animation: floatHeart 1.6s ease-out forwards;
      z-index: 20;
      text-shadow: 0 0 10px rgba(255, 140, 170, 0.55);
    }

    @keyframes floatHeart {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0.35) rotate(-12deg);
      }
      18% { opacity: 1; }
      100% {
        opacity: 0;
        transform: translateY(-110px) scale(1.4) rotate(14deg);
      }
    }

    /* Kiss */
    .kiss {
      position: absolute;
      left: 55%;
      top: 17%;
      color: #ff9eb5;
      font-size: clamp(24px, 3.6vw, 38px);
      pointer-events: none;
      animation: kissFly 1.75s cubic-bezier(0.22, 0.85, 0.3, 1) forwards;
      z-index: 20;
      text-shadow: 0 0 12px rgba(255, 120, 160, 0.7);
    }

    @keyframes kissFly {
      0% {
        opacity: 0;
        transform: scale(0.3);
      }
      25% { opacity: 1; }
      100% {
        opacity: 0;
        transform: scale(1.55) translate(75px, -85px) rotate(18deg);
      }
    }

    /* Message */
    .message {
      position: absolute;
      left: 50%;
      top: 48%;
      transform: translateX(-50%);
      color: #ffe6ee;
      font-size: clamp(13px, 2.1vw, 21px);
      opacity: 0;
      white-space: nowrap;
      pointer-events: none;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85);
      transition: opacity 0.3s ease;
      z-index: 15;
      font-weight: 500;
    }

    .scene.petting .message {
      opacity: 1;
    }

    .scene.petting img {
      filter: brightness(1.04) saturate(1.06);
      transition: filter 0.3s ease;
    }

    /* Mobile */
    @media (max-width: 700px) {
      .scene {
        width: 100vw;
        height: 100vh;
        aspect-ratio: auto;
      }

      .scene img {
        object-fit: cover;
        object-position: center 25%;
      }

      .yan-touch {
        left: 32%;
        top: 14%;
        width: 36%;
        height: 38%;
      }

      .blush.left  { left: 42.2%; top: 33.2%; }
      .blush.right { left: 51.3%; top: 33.2%; }

      .message { top: 53%; }
    }
  </style>
</head>
<body>

  <div class="scene" id="scene">
    <img src="room.png" alt="Yan" draggable="false" />

    <button class="yan-touch" id="yanTouch" aria-label="ناز کردن یان"></button>

    <div class="blush left"></div>
    <div class="blush right"></div>

    <div class="message" id="message">hehe... ♡</div>
  </div>

  <script>
    const scene   = document.getElementById("scene");
    const button  = document.getElementById("yanTouch");
    const message = document.getElementById("message");

    let audioCtx = null;
    let isPetting = false;

    function playCuteSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === "suspended") audioCtx.resume();

        const now = audioCtx.currentTime;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        osc.type = "sine";
        osc.frequency.setValueAtTime(940, now);
        osc.frequency.exponentialRampToValueAtTime(1420, now + 0.09);

        filter.type = "lowpass";
        filter.frequency.value = 2400;

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.15, now + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.23);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.24);

        const sparkle = audioCtx.createOscillator();
        const sGain = audioCtx.createGain();
        sparkle.type = "sine";
        sparkle.frequency.value = 2150;
        sGain.gain.setValueAtTime(0.045, now + 0.05);
        sGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        sparkle.connect(sGain);
        sGain.connect(audioCtx.destination);
        sparkle.start(now + 0.05);
        sparkle.stop(now + 0.16);
      } catch (e) {}
    }

    function makeHeart(x, y) {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = ["♡", "♥", "✧"][Math.floor(Math.random() * 3)];
      heart.style.left = x + "%";
      heart.style.top = y + "%";
      scene.appendChild(heart);
      setTimeout(() => heart.remove(), 1700);
    }

    const messages = [
      "hehe... ♡",
      "that feels nice...",
      "you're so sweet ♡",
      "again? please...",
      "mmm\~ ♡",
      "I like that...",
      "more? ♡"
    ];

    button.addEventListener("click", () => {
      if (isPetting) return;
      isPetting = true;

      scene.classList.add("petting");
      message.textContent = messages[Math.floor(Math.random() * messages.length)];
      playCuteSound();

      for (let i = 0; i < 3; i++) {
        setTimeout(() => {
          makeHeart(40 + Math.random() * 20, 18 + Math.random() * 14);
        }, i * 100);
      }

      setTimeout(() => {
        scene.classList.remove("petting");
        isPetting = false;
      }, 1450);
    });

    button.addEventListener("touchstart", (e) => {
      e.preventDefault();
      button.click();
    }, { passive: false });

    setInterval(() => {
      makeHeart(37 + Math.random() * 26, 14 + Math.random() * 22);
    }, 10500);

    setInterval(() => {
      const kiss = document.createElement("div");
      kiss.className = "kiss";
      kiss.textContent = "♡";
      scene.appendChild(kiss);
      setTimeout(() => kiss.remove(), 1850);
    }, 15500);

    document.querySelector("img").addEventListener("dragstart", e => e.preventDefault());
  </script>
</body>
</html>
